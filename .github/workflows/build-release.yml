name: Build & Release APK

# Triggers when a version tag (e.g. v1.2.0) is pushed.
# Builds the release APK, computes its SHA256, attaches it to a GitHub Release,
# regenerates release.json (the source of truth read by the in-app updater) and
# commits it back to main, then mirrors everything to Gitee.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0). Must already exist or will be created from HEAD.'
        required: true

permissions:
  contents: write

env:
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}
  GITEE_OWNER: ${{ vars.GITEE_OWNER || github.repository_owner }}
  GITEE_REPO: ${{ vars.GITEE_REPO || github.event.repository.name }}

jobs:
  build:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "No release keystore secret found, falling back to debug signing."
            exit 0
          fi
          mkdir -p app/keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > app/keystore/taskflow-release.jks
          cat > app/keystore/keystore.properties <<EOF
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Locate APK & compute metadata
        id: apk
        run: |
          set -eux
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" app-release.apk
          SIZE=$(stat -c %s app-release.apk)
          SHA=$(sha256sum app-release.apk | awk '{print $1}')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

          TAG="${{ steps.tag.outputs.name }}"
          VERSION_NAME="${TAG#v}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # versionCode = major*10000 + minor*100 + patch (zero-padded segments)
          IFS='.-' read -r MA MI PA <<< "$VERSION_NAME"
          CODE=$(( ${MA:-0}*10000 + ${MI:-0}*100 + ${PA:-0} ))
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          NOTES=$(awk -v tag="$TAG" '
            BEGIN { capture=0 }
            /^## / {
              if (capture) exit
              if (index($0, tag) > 0) { capture=1; next }
            }
            capture { print }
          ' CHANGELOG.md 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          # Persist & expose as multiline output
          printf '%s' "$NOTES" > /tmp/release_notes.md
          echo "path=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & upload APK
        id: ghrelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: app-release.apk
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Build release.json
        env:
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SIZE: ${{ steps.apk.outputs.size }}
          TAG: ${{ steps.tag.outputs.name }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          set -eu
          GITHUB_DOWNLOAD_URL="https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases/download/${TAG}/app-release.apk"
          # Gitee mirror download (filled after Gitee release is created; left as primary here).
          GITEE_DOWNLOAD_URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}/app-release.apk"

          # Build JSON via jq to keep quoting safe; multi-line log is embedded as a JSON string.
          LOG=$(jq -Rs '.' < "$NOTES_FILE")

          jq -n \
            --arg version "$VERSION_NAME" \
            --argjson code "$VERSION_CODE" \
            --arg tag "$TAG" \
            --arg log "$LOG" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            --arg gh "$GITHUB_DOWNLOAD_URL" \
            --arg gitee "$GITEE_DOWNLOAD_URL" \
            --arg ghproxy "https://gh-proxy.com/$GITHUB_DOWNLOAD_URL" \
            --arg ghfast "https://ghfast.top/$GITHUB_DOWNLOAD_URL" \
            '{
              version: $version,
              code: $code,
              versionTag: $tag,
              log: $log,
              apk: $gh,
              sha256: $sha256,
              size: $size,
              downloadUrls: [
                { name: "Gitee",     url: $gitee,      region: "domestic" },
                { name: "GH Proxy",  url: $ghproxy,    region: "domestic" },
                { name: "GH Fast",   url: $ghfast,     region: "cdn" },
                { name: "GitHub",    url: $gh,         region: "international" }
              ]
            }' > release.json
          # jq -Rs wraps the whole string in quotes, so log is already a JSON string literal;
          # but above we passed it through --arg, so it gets re-escaped. That is the desired behaviour.

      - name: Commit release.json to main
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json
          if git diff --cached --quiet; then
            echo "release.json unchanged"
          else
            git commit -m "chore(release): update release.json for ${{ steps.tag.outputs.name }}"
            git push origin HEAD:main
          fi

      - name: Mirror to Gitee
        if: ${{ vars.GITEE_MIRROR == 'true' && secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          set -eu
          # 1) Sync repo (force push tags + main)
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git push gitee main --force
          git push gitee "$TAG" --force

          # 2) Create Gitee release
          BODY=$(jq -Rs '.' < "$NOTES_FILE")
          RELEASE_ID=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":${BODY},\"target_commitish\":\"main\"}" \
            | jq -r .id)

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create Gitee release"; exit 1
          fi

          # 3) Upload APK asset to Gitee release
          curl -s -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
            -H "Content-Type: multipart/form-data" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@app-release.apk" \
            | jq .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-release-${{ steps.tag.outputs.name }}
          path: |
            app-release.apk
            release.json
          if-no-files-found: error
