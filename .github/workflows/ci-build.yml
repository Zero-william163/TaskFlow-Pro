name: CI Build

# Runs on every push to main and on pull requests. Verifies the project still
# compiles (debug + release variants) but does NOT publish anything.
# The publishing flow lives in build-release.yml and is triggered by version tags.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug & release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: taskflow-debug-ci
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: taskflow-release-ci
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
